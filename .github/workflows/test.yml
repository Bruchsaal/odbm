name: Tests

# The release workflow only fires on v* tags, so without this a pull request
# gets no signal at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # All three, because the release workflow builds all three. A Windows-only
    # failure previously surfaced at tag time and blocked the release instead
    # of failing on the push that caused it.
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # The frontend escaping tests skip without node; ubuntu-latest ships it,
      # so fail loudly if they were silently skipped.
      - name: Confirm frontend tests ran
        if: runner.os == 'Linux'
        run: |
          node --version
          python -m pytest tests/test_frontend.py -q --no-header -rs 2>&1 | tee /tmp/fe.txt
          if grep -q "skipped" /tmp/fe.txt; then
            echo "::error::frontend tests were skipped"
            exit 1
          fi
